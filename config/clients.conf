# ============================================================================
# FreeRADIUS Clients Configuration
# ============================================================================
# Static client definitions for local and private network subnets.
# Individual NAS routers and APs with specific per-device shared secrets are
# loaded dynamically from the PostgreSQL 'nas' table via rlm_sql.
# ============================================================================

client localhost {
    ipaddr = 127.0.0.1
    secret = $ENV{RADIUS_SECRET}
    require_message_authenticator = yes
    nas_type = other
}

client localhost_ipv6 {
    ipv6addr = ::1
    secret = $ENV{RADIUS_SECRET}
    require_message_authenticator = yes
    nas_type = other
}

# Docker bridge / internal container network
client docker_network {
    ipaddr = 172.16.0.0/12
    secret = $ENV{RADIUS_SECRET}
    require_message_authenticator = auto
    nas_type = other
}

# Enterprise LAN / AP Management Subnets
client private_lan_10 {
    ipaddr = 10.0.0.0/8
    secret = $ENV{RADIUS_SECRET}
    require_message_authenticator = auto
    nas_type = other
}

client private_lan_192 {
    ipaddr = 192.168.0.0/16
    secret = $ENV{RADIUS_SECRET}
    require_message_authenticator = auto
    nas_type = other
}
